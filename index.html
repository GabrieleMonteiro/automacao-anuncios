<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gerador de anúncios dos cursos gratuitos do CESS.">
  <title>Estúdio de Anúncios</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header class="cabecalho">
    <h1>Estúdio de Anúncios</h1>
    <p class="subtitulo">Gere anúncios para os cursos gratuitos do CESS.</p>
  </header>

  <nav class="abas" role="tablist" aria-label="Seções">
    <button type="button" class="aba" role="tab" id="aba-inicio"
            aria-controls="painel-inicio" aria-selected="true" data-aba="inicio">Início</button>
    <button type="button" class="aba" role="tab" id="aba-cursos"
            aria-controls="painel-cursos" aria-selected="false" tabindex="-1" data-aba="cursos">Cursos</button>
  </nav>

  <main class="conteudo">
    <section id="painel-inicio" class="painel" role="tabpanel" aria-labelledby="aba-inicio">
      <h2>Gerar anúncio</h2>
      <div id="formulario-geracao" class="espaco-reservado">
        <p>O formulário de geração aparecerá aqui.</p>
      </div>
    </section>

    <section id="painel-cursos" class="painel" role="tabpanel" aria-labelledby="aba-cursos" hidden>
      <h2>Cursos</h2>
      <p class="aviso">Carregando…</p>
    </section>
  </main>

  <footer class="rodape">
    <p>CESS · Cursos gratuitos</p>
  </footer>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
